<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      --apple-blue: #0071e3;
      --apple-blue-hover: #0077ed;
      --apple-text-primary: #1d1d1f;
      --apple-text-secondary: #86868b;
      --apple-border: #d2d2d7;
      --apple-bg: #f5f5f7;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      font-family: var(--apple-font);
      background-color: #ffffff;
      color: var(--apple-text-primary);
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--apple-border);
      margin-bottom: 16px;
    }
    .icon-box {
      width: 34px;
      height: 34px;
      background-color: #1d1d1f;
      color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-box svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--apple-text-primary);
      margin: 0;
      letter-spacing: -0.015em;
    }
    .badge {
      font-size: 11px;
      color: var(--apple-text-secondary);
      margin-top: 1px;
      display: block;
    }
    .desc {
      font-size: 12.5px;
      color: var(--apple-text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .action-btn {
      width: 100%;
      background-color: var(--apple-blue);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 980px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s;
    }
    .action-btn:hover {
      background-color: var(--apple-blue-hover);
    }
    .action-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .footer-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--apple-text-secondary);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-box">
      <svg viewBox="0 0 24 24"><path d="M21 8.5V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5"/><polyline points="22 6 12 13 2 6"/><polygon points="12 1 8 7 12 7 11 13 16 6 12 6 12 1" fill="#0071e3" stroke="none"/></svg>
    </div>
    <div>
      <h1 class="title">Emailer Pro Suite</h1>
      <span class="badge">by Badal</span>
    </div>
  </div>

  <div class="desc">
    Automated personalization and delivery engine for Gmail. Load recipients, configure inlined layouts, and dispatch mail merges.
  </div>

  <button class="action-btn" id="btn-open-gmail">
    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    <span>Open Gmail Console</span>
  </button>

  <div class="footer-note">
    Click the launcher pill in the bottom-right of Gmail.
  </div>

  <script src="popup.js"></script>
</body>
</html>
